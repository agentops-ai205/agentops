services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agentops
      POSTGRES_USER: agentops
      POSTGRES_PASSWORD: agentops
    ports:
      - "5432:5432"
    volumes:
      - agentops_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentops -d agentops"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgres://agentops:agentops@postgres:5432/agentops
      API_HOST: 0.0.0.0
      API_PORT: 3000
      AGENTOPS_PROJECT_ROOT: /app
      AGENTOPS_CORE_CLI_PATH: /app/bin/agentops
      AGENTOPS_DEFAULT_ORGANIZATION_ID: org.default
      AGENTOPS_ALLOWED_ORIGINS: http://127.0.0.1:8080,http://localhost:8080
      AGENTOPS_POLICY_ENGINE: rust_core_strict
      AGENTOPS_SANDBOX_ENGINE: rust_core
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    ports:
      - "3000:3000"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_URL: http://127.0.0.1:3000
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  agentops_pg:
