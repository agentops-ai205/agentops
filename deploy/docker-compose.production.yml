services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile.api
    env_file:
      - ./production.env
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 3000
      AGENTOPS_PROJECT_ROOT: /app
      AGENTOPS_CORE_CLI_PATH: /app/bin/agentops
      AGENTOPS_POLICY_ENGINE: rust_core_strict
      AGENTOPS_SANDBOX_ENGINE: rust_core
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 6
    ports:
      - "3000:3000"
    restart: unless-stopped

  web:
    profiles: ["web"]
    build:
      context: ..
      dockerfile: Dockerfile.web
      args:
        VITE_API_URL: ${VITE_API_URL:-https://api.agentops.ai}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped
