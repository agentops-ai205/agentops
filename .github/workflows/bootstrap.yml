name: Bootstrap AgentOps source

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore AgentOps source tree
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cat > /tmp/agentops-source.txz.b64 <<'AGENTOPS_SOURCE_ARCHIVE'
          
          AGENTOPS_SOURCE_ARCHIVE
          base64 -d /tmp/agentops-source.txz.b64 > /tmp/agentops-source.tar.xz
          xz -d -c /tmp/agentops-source.tar.xz > /tmp/agentops-source.tar
          tar -xf /tmp/agentops-source.tar -C .
          git add -A
          if git diff --cached --name-only | grep -E '^\.github/workflows/'; then
            echo "Refusing to change workflow files from GitHub Actions token."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Initial AgentOps production platform" || exit 0
          git push
