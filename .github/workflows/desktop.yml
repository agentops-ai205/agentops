name: AgentOps Desktop

on:
  workflow_dispatch:
  push:
    branches: ["codex/agentops-v3-production"]
    tags:
      - "v*"
  pull_request:
    branches: ["codex/agentops-v3-production"]
    paths:
      - ".github/workflows/desktop.yml"
      - "apps/desktop/**"
      - "apps/web/**"
      - "packages/shared/**"
      - "package.json"
      - "package-lock.json"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"

permissions:
  contents: write

concurrency:
  group: agentops-desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  VITE_API_URL: https://agentic-unicorn-os.netlify.app/api
  APPLE_SIGNING_ENABLED: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' && secrets.KEYCHAIN_PASSWORD != '' }}

jobs:
  build-desktop:
    name: Build desktop ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            os: macos-latest
          - name: windows
            os: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            target
            apps/desktop/src-tauri/target
          key: ${{ runner.os }}-desktop-cargo-${{ hashFiles('Cargo.lock', 'apps/desktop/src-tauri/Cargo.lock', 'apps/desktop/src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-desktop-cargo-

      - name: Install dependencies
        run: npm ci

      - name: Report unsigned macOS release mode
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v') && env.APPLE_SIGNING_ENABLED != 'true'
        run: |
          echo "Apple signing secrets are missing."
          echo "This tag will publish an unsigned macOS build plus the terminal installer helper."
          echo "Add APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID and KEYCHAIN_PASSWORD for a notarized public DMG."

      - name: Import Apple Developer ID certificate
        if: runner.os == 'macOS' && env.APPLE_SIGNING_ENABLED == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/apple_developer_id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/agentops-signing.keychain-db"

          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          CERT_ID="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk -F'"' '/Developer ID Application/ {print $2; exit}')"
          if [ -z "$CERT_ID" ]; then
            echo "No Developer ID Application identity found in imported certificate."
            security find-identity -v -p codesigning "$KEYCHAIN_PATH"
            exit 1
          fi

          echo "APPLE_SIGNING_IDENTITY=$CERT_ID" >> "$GITHUB_ENV"
          echo "Imported Apple Developer ID certificate."

      - name: Build shared web surface
        run: npm --workspace @agentops/shared run build && npm --workspace @agentops/web run build

      - name: Check desktop runtime
        run: npm run desktop:check

      - name: Relax macOS bundle config for unsigned builds
        if: runner.os == 'macOS' && env.APPLE_SIGNING_ENABLED != 'true'
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");
          const configPath = "apps/desktop/src-tauri/tauri.conf.json";
          const config = JSON.parse(fs.readFileSync(configPath, "utf8"));
          if (config.bundle?.macOS) {
            delete config.bundle.macOS.hardenedRuntime;
            delete config.bundle.macOS.entitlements;
          }
          fs.writeFileSync(configPath, `${JSON.stringify(config, null, 2)}\n`);
          NODE

      - name: Build desktop app
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
        run: |
          for attempt in 1 2; do
            rm -rf apps/desktop/src-tauri/target/release/bundle desktop-artifacts
            if npm run desktop:build; then
              exit 0
            fi
            if [ "$attempt" -eq 2 ]; then
              exit 1
            fi
            sleep 10
          done

      - name: Collect desktop bundle
        shell: bash
        run: |
          mkdir -p desktop-artifacts
          find apps/desktop/src-tauri/target/release/bundle -type f \
            \( -name "*.dmg" -o -name "*.msi" -o -name "*.exe" -o -name "*.app.tar.gz" -o -name "*.app.tar.gz.sig" \) \
            -exec cp {} desktop-artifacts/ \;
          find desktop-artifacts -maxdepth 1 -type f -print

      - name: Add unsigned macOS installer helper
        if: runner.os == 'macOS' && env.APPLE_SIGNING_ENABLED != 'true'
        shell: bash
        run: |
          cp scripts/install-agentops-ide-macos.sh desktop-artifacts/install-agentops-ide-macos.sh
          chmod +x desktop-artifacts/install-agentops-ide-macos.sh
          cat > desktop-artifacts/README-macOS-unsigned.txt <<'EOF'
          AgentOps IDE macOS unsigned build

          This build is not Apple notarized yet. Browser downloads can trigger Gatekeeper quarantine.
          Install from Terminal instead:

            curl -fsSL https://github.com/agentops-ai205/agentops/releases/latest/download/install-agentops-ide-macos.sh | zsh

          Or install a specific tag:

            curl -fsSL https://github.com/agentops-ai205/agentops/releases/download/v1.0.8/install-agentops-ide-macos.sh | zsh -s -- v1.0.8

          Once Apple Developer signing secrets are configured, future DMGs can open normally by double-click.
          EOF
          find desktop-artifacts -maxdepth 1 -type f -print

      - name: Upload desktop bundle
        uses: actions/upload-artifact@v4
        with:
          name: agentops-desktop-${{ matrix.name }}-${{ github.sha }}
          path: desktop-artifacts/**
          if-no-files-found: error

      - name: Attach bundle to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: desktop-artifacts/**
