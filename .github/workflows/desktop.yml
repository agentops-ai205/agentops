name: AgentOps Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-desktop:
    name: Build desktop ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Verify shared product build
        run: npm run build

      - name: Build desktop app
        run: npm run desktop:build

      - name: Upload desktop bundle
        uses: actions/upload-artifact@v4
        with:
          name: agentops-desktop-${{ matrix.os }}
          path: apps/desktop/src-tauri/target/release/bundle/**
          if-no-files-found: error
