name: AgentOps CI

on:
  push:
    branches: ["codex/agentops-v3-production"]
  pull_request:
    branches: ["codex/agentops-v3-production"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test -- --run

      - name: Build
        run: npm run build

      - name: Build API image
        run: docker build -f Dockerfile.api -t agentops-api:ci .

      - name: Build web image
        run: docker build -f Dockerfile.web -t agentops-web:ci .
