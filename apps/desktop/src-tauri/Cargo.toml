[package]
name = "agentops-desktop"
version = "1.0.5"
description = "AgentOps IDE desktop shell for macOS and Windows."
authors = ["AgentOps"]
license = "Proprietary"
repository = "https://github.com/agentops-ai205/agentops"
edition = "2021"

[workspace]

[lib]
name = "agentops_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
